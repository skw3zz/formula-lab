<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Укради ядро: Лаборатория мутантов</title><style>*{box-sizing:border-box}body{margin:0;background:#090e20;color:#fff;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}#hud span{background:#111b38db;padding:9px 13px;border:1px solid #45557d;border-radius:12px;font-weight:800}#bar{position:fixed;bottom:15px;left:10px;right:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{background:#7955ef;color:white;border:1px solid #ac96ff;border-radius:13px;padding:12px 14px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px #0006}button:disabled{opacity:.5}#msg{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#172548eb;border-radius:12px;padding:10px 14px;text-align:center;min-width:220px;pointer-events:none}#modal{position:fixed;inset:0;background:#030817dc;display:none;align-items:center;justify-content:center;padding:18px}#panel{width:min(460px,100%);max-height:80vh;overflow:auto;background:#162347;border:1px solid #526aab;border-radius:22px;padding:20px}#panel button{margin:5px}small{color:#b9c7ef}#close{float:right}#bar{bottom:calc(12px + env(safe-area-inset-bottom));justify-content:flex-end;left:40%;gap:6px}#bar button{font-size:12px;padding:10px 8px;min-height:44px}#hud{top:calc(8px + env(safe-area-inset-top));gap:4px}#hud span{font-size:12px;padding:8px 7px}#msg{top:calc(54px + env(safe-area-inset-top));font-size:12px;min-width:0;max-width:90vw}#joystick{position:fixed;left:20px;bottom:calc(26px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:#4868ac55;border:2px solid #94b4f477;touch-action:none;display:none;align-items:center;justify-content:center;z-index:3}#stick{width:49px;height:49px;border-radius:50%;background:#80c7ff;border:3px solid #d9f5ff;box-shadow:0 0 20px #45aaff77;transform:translate(0,0)}@media(pointer:coarse){#joystick{display:flex}#bar{left:145px}#panel{max-height:75dvh}button{touch-action:manipulation}}@media(max-width:390px){#bar button{font-size:11px;padding:8px 6px}#joystick{left:12px;width:104px;height:104px}#bar{left:124px}#hud span{font-size:11px}}@media(orientation:landscape) and (max-height:500px){#joystick{width:90px;height:90px;bottom:12px}#bar{left:115px;bottom:8px}#msg{display:none}}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="coins">🪙 0</span><span id="level">⚡ Ур. 1</span><span id="bag">🎒 0/5</span></div><div id="msg">Собирай светящиеся ядра!</div><div id="bar"><button id="sell">🏠 Сдать ядра</button><button id="upgrade">⬆️ Улучшения</button><button id="collection">🧬 Коллекция</button><button id="bonus">🎁 Бонус</button></div><div id="joystick" aria-label="Джойстик движения"><div id="stick"></div></div><div id="modal"><div id="panel"><button id="close">✕</button><div id="content"></div></div></div><script src="/sdk.js" onerror="window.sdkUnavailable=true"></script><script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1,ysdk=null,adBusy=false;const $=id=>document.getElementById(id);const defaults={coins:0,level:1,capacity:5,speed:1,collection:[],total:0};let state={...defaults};try{let s=JSON.parse(localStorage.getItem('corelab_save'));if(s&&typeof s==='object'){state={...defaults,...s};if(!Array.isArray(state.collection))state.collection=[]}}catch(e){}let player={x:0,y:0},base={x:0,y:0},cores=[],keys={},pointer=null,joy={x:0,y:0},last=0,spawn=0,noticeUntil=0,paused=false;const types=[{name:'Искра',color:'#61e8ff',value:5,weight:60},{name:'Плазма',color:'#fd77d4',value:12,weight:28},{name:'Квант',color:'#ffca57',value:30,weight:10},{name:'Сингулярность',color:'#adff7b',value:90,weight:2}];let bag=[];function resize(){W=document.documentElement.clientWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);base={x:W/2,y:H/2};if(!player.x){player.x=base.x;player.y=base.y}}addEventListener('resize',resize);resize();function save(){try{localStorage.setItem('corelab_save',JSON.stringify(state))}catch(e){}}function hud(){$('coins').textContent='🪙 '+Math.floor(state.coins);$('level').textContent='⚡ Ур. '+state.level;$('bag').textContent='🎒 '+bag.length+'/'+state.capacity}function notify(s){$('msg').textContent=s;noticeUntil=performance.now()+3000}function pick(){let n=Math.random()*100;for(const t of types){n-=t.weight;if(n<=0)return t}return types[0]}function spawnCore(){let t=pick(),a=Math.random()*Math.PI*2,r=100+Math.random()*Math.max(130,Math.min(W,H)*.42);cores.push({x:Math.max(25,Math.min(W-25,base.x+Math.cos(a)*r)),y:Math.max(95,Math.min(H-105,base.y+Math.sin(a)*r)),t,phase:Math.random()*6.28})}for(let i=0;i<18;i++)spawnCore();function deposit(){if(Math.hypot(player.x-base.x,player.y-base.y)>85){notify('Подойди к базе в центре карты');return}if(!bag.length){notify('Сначала собери ядра');return}let earned=bag.reduce((s,t)=>s+t.value,0);state.coins+=earned;state.total+=bag.length;for(const t of bag)if(!state.collection.includes(t.name))state.collection.push(t.name);bag=[];hud();save();notify('Продано! +'+earned+' монет');if(state.total%15<5)showInterstitial()}function modal(html){paused=true;$('content').innerHTML=html;$('modal').style.display='flex'}function close(){paused=false;$('modal').style.display='none'}$('close').onclick=close;$('sell').onclick=deposit;$('upgrade').onclick=()=>{let a=state.capacity*12,b=state.level*35,c=state.speed*100;modal('<h2>🔧 Улучшения</h2><p>Монеты: '+Math.floor(state.coins)+'</p><button data-up="capacity">🎒 Рюкзак +2 — '+a+' 🪙</button><button data-up="level">🧲 Радиус сбора — '+b+' 🪙</button><button data-up="speed">👟 Скорость — '+c+' 🪙</button><p><small>Подбирай ядра и сдавай их на базе.</small></p>')};$('collection').onclick=()=>modal('<h2>🧬 Коллекция мутантов</h2>'+types.map(t=>'<p style="color:'+t.color+'">'+(state.collection.includes(t.name)?'✓ '+t.name:'🔒 Неизвестный образец')+'</p>').join('')+'<p>Всего доставлено ядер: '+state.total+'</p>');$('content').addEventListener('click',e=>{let k=e.target.dataset.up;if(!k)return;let price=k==='capacity'?state.capacity*12:k==='level'?state.level*35:state.speed*100;if(state.coins<price){notify('Недостаточно монет');return}state.coins-=price;if(k==='capacity')state.capacity+=2;else if(k==='level')state.level++;else state.speed++;save();hud();close();notify('Улучшение куплено!')});$('bonus').onclick=()=>{if(!ysdk?.adv?.showRewardedVideo){notify('Бонусная реклама доступна в Яндекс Играх');return}if(adBusy)return;adBusy=true;paused=true;let rewarded=false;try{ysdk.adv.showRewardedVideo({callbacks:{onOpen:()=>{},onRewarded:()=>{rewarded=true;state.coins+=100;save();hud()},onClose:()=>{adBusy=false;paused=false;notify(rewarded?'Получено 100 монет!':'Бонус не получен')},onError:()=>{adBusy=false;paused=false;notify('Реклама недоступна')}}})}catch(e){adBusy=false;paused=false}};function showInterstitial(){if(!ysdk?.adv?.showFullscreenAdv||adBusy)return;adBusy=true;paused=true;try{ysdk.adv.showFullscreenAdv({callbacks:{onClose:()=>{adBusy=false;paused=false},onError:()=>{adBusy=false;paused=false}}})}catch(e){adBusy=false;paused=false}}function pos(e){return{x:e.clientX,y:e.clientY}}const joystick=$('joystick'),stick=$('stick');let joyId=null;function moveJoy(e){const r=joystick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),length=Math.hypot(x,y)||1,limit=r.width*.32,scale=Math.min(1,limit/length);joy.x=x/Math.max(length,limit);joy.y=y/Math.max(length,limit);stick.style.transform='translate('+x*scale+'px,'+y*scale+'px)'}joystick.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joystick.setPointerCapture(joyId);moveJoy(e)});joystick.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});function resetJoy(e){if(e.pointerId!==joyId)return;joyId=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}joystick.addEventListener('pointerup',resetJoy);joystick.addEventListener('pointercancel',resetJoy);canvas.addEventListener('pointerdown' ,e=>{pointer=pos(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer)pointer=pos(e)});canvas.addEventListener('pointerup',()=>pointer=null);canvas.addEventListener('pointercancel',()=>pointer=null);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}function frame(now){let dt=Math.min((now-last)/16.67||1,2);last=now;ctx.fillStyle='#0b1230';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#1c2c52';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}circle(base.x,base.y,65,'#244774');circle(base.x,base.y,51,'#315c94');circle(base.x,base.y,37,'#50b9c7');ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('БАЗА',base.x,base.y+5);if(!paused){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(Math.hypot(joy.x,joy.y)>.05){dx=joy.x;dy=joy.y}else if(pointer){dx=pointer.x-player.x;dy=pointer.y-player.y;if(Math.hypot(dx,dy)<14)dx=dy=0}let len=Math.hypot(dx,dy);if(len){let sp=(2.6+state.speed*.45)*dt;player.x=Math.max(17,Math.min(W-17,player.x+dx/len*sp));player.y=Math.max(80,Math.min(H-95,player.y+dy/len*sp))}spawn+=dt;if(spawn>45&&cores.length<32){spawnCore();spawn=0}for(let i=cores.length-1;i>=0;i--){let c=cores[i];if(Math.hypot(c.x-player.x,c.y-player.y)<21+state.level*7&&bag.length<state.capacity){bag.push(c.t);cores.splice(i,1);hud();if(bag.length===state.capacity)notify('Рюкзак полон! Вернись на базу')}}}for(const c of cores){let glow=12+Math.sin(now/330+c.phase)*3;circle(c.x,c.y,glow+5,c.t.color+'33');circle(c.x,c.y,glow,c.t.color);circle(c.x-4,c.y-4,3,'#ffffffaa')}circle(player.x,player.y,22,'#091326');circle(player.x,player.y,17,'#f1f5ff');circle(player.x-5,player.y-3,3,'#18264a');circle(player.x+5,player.y-3,3,'#18264a');ctx.strokeStyle='#18264a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y+2,7,0.15,Math.PI-.15);ctx.stroke();if(now>noticeUntil&&$('msg').textContent!=='Собирай светящиеся ядра!')$('msg').textContent='Собирай ядра и возвращайся на базу';requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);async function init(){try{if(typeof YaGames==='undefined')return;ysdk=await YaGames.init();ysdk.features?.LoadingAPI?.ready?.()}catch(e){console.warn('SDK unavailable in local preview',e)}}init();window.coreLabTest={getState:()=>({...state}),getBag:()=>bag.length,spawnCore,deposit};})();
</script></body></html>
